name: Deploy to Server

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.10.0'

      - name: Create .env File from ENV Secret
        run: |
          echo -e "${{ vars.ENV }}" > .env  # Creating the .env file

      - name: Install dependencies
        run: yarn install

      - name: Generate Prisma
        run: yarn gen:prisma

      - name: Build API
        run: yarn build

      - name: Zip files (excluding certain files)
        run: zip -r target.zip ./dist ./src/prisma ./package.json ./yarn.lock .env

      - name: Prepare Server Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            pm2 delete ${{ secrets.PM2_NAME }} || true
            set -e
            # Clean up existing files and create the working directory
            rm -rf ${{ secrets.SERVER_WORK_DIR }}
            mkdir -p ${{ secrets.SERVER_WORK_DIR }}

      - name: Upload code to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: target.zip
          target: ${{ secrets.SERVER_WORK_DIR }}

      - name: Execute commands on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            unzip -o ${{ secrets.SERVER_WORK_DIR }}/target.zip -d ${{ secrets.SERVER_WORK_DIR }}
            rm ${{ secrets.SERVER_WORK_DIR }}/target.zip
            # Install packages and start the app
            cd ${{ secrets.SERVER_WORK_DIR }}
            yarn
            yarn gen:prisma
            pm2 start yarn --name ${{ secrets.PM2_NAME }} -- start:prod
            pm2 save
